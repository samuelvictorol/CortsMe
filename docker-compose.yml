services:
  mongo:
    image: mongo:7-jammy
    container_name: cortsme-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - cortsme_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 8s
      timeout: 4s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: cortsme-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - cortsme_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 8s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortsme-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 4s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://localhost:3000/api
        SOCKET_URL: http://localhost:3000
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: cortsme-frontend
    restart: unless-stopped
    ports:
      - "9000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  cortsme_mongo_data:
  cortsme_redis_data:
